name: Check and publish SOHO rules

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      data_only:
        description: Refresh community data using the daily checks
        type: boolean
        default: false
  schedule:
    - cron: '18 2 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check generated syntax, routing and staged paths
        run: |
          python -m pip install PyYAML==6.0.3
          python -B tools/build_configs.py --check
          python -B tools/check_release.py --staged
      - name: Scan secrets with Gitleaks
        run: |
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --max-decode-depth 3 --no-banner .
      - name: Prepare approved static files
        id: release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          DATA_ONLY: ${{ github.event_name == 'schedule' || inputs.data_only }}
          SOHO_CATALOG_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$DATA_ONLY" = "true" ]; then
            base="https://sam-lumina.github.io/soho-network-rules"
            for name in mihomo-merge.yaml shadowrocket.conf; do
              curl --fail --silent --show-error --proto '=https' -H 'Cache-Control: no-cache' "$base/stable/$name" -o "$RUNNER_TEMP/$name"
              if ! cmp --silent "$RUNNER_TEMP/$name" "dist/stable/$name"; then
                echo "Stable has a different reviewed configuration. Waiting for manual release."
                exit 0
              fi
            done
            python -B tools/build_community_data.py
            python -B tools/check_release.py
            changed=0
            for name in media.list adult.list gambling.list services-proxy.list services-direct.list; do
              curl --fail --silent --show-error --proto '=https' -H 'Cache-Control: no-cache' \
                "$base/data/community-v1/$name" -o "$RUNNER_TEMP/$name"
              cmp --silent "$RUNNER_TEMP/$name" "dist/data/community-v1/$name" || changed=1
            done
            if [ "$changed" = "0" ]; then
              echo "Community rule data is current."
              exit 0
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Package reviewed static files
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: stable-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy Stable
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
