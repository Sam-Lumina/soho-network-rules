# Clash Verge Rev subscription-level Merge; install over your own profile.
find-process-mode: strict
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - REJECT
  include-all-proxies: true
  include-all-providers: true
  exclude-type: Direct|Compatible
  default-selected: REJECT
  empty-fallback: REJECT
- name: GLOBAL
  type: select
  proxies:
  - PROXY
  empty-fallback: REJECT
